      <rect x="0" y="0" width="219" height="10" rx="3" fill="#3178c6"/>
      <rect x="219" y="0" width="146" height="10" fill="#3572A5"/>
      <rect x="365" y="0" width="21" height="10" fill="#b07219"/>
      <rect x="386" y="0" width="8" height="10" fill="#563d7c"/>
      <rect x="394" y="0" width="6" height="10" rx="3" fill="#e34c26"/>
    </g>

    <!-- Language Breakdown List -->
    <g transform="translate(0, 52)">
      <!-- TypeScript -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="-4" r="4" fill="#3178c6"/>
        <text x="18" y="0" font-size="11" font-weight="600" fill="#f0f6fc">TypeScript</text>
        <text x="120" y="0" font-size="11" fill="#8b949e">1.38 MB</text>
        <text x="210" y="0" font-size="11" fill="#58a6ff">54.9%</text>
        <text x="270" y="0" font-size="10" fill="#7d8590">Next.js 16 · Ext-V3 · Scheduler</text>
