<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 20" width="100%" height="20">
  <defs>
    <linearGradient id="div-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0" />
      <stop offset="15%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="div-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="960" height="20" fill="#090d16" />

  <!-- Base Hairline Track -->
  <line x1="48" y1="10" x2="912" y2="10" stroke="url(#div-track)" stroke-width="1" />

  <!-- Smooth Ambient Beam Shift -->
  <line x1="-120" y1="10" x2="-20" y2="10" stroke="url(#div-pulse)" stroke-width="1.8">
    <animate attributeName="x1" from="-120" to="980" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x2" from="-20" to="1080" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Center Micro Node -->
  <circle cx="480" cy="10" r="2.5" fill="#58a6ff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>