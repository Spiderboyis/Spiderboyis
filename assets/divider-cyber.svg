<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 20" width="100%" height="20">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="center-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="center-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Razor Gradient Track -->
  <line x1="48" y1="10" x2="912" y2="10" stroke="url(#divider-grad)" stroke-width="1.2" />

  <!-- Smooth Ambient Beam Shift -->
  <line x1="-120" y1="10" x2="-20" y2="10" stroke="url(#center-beam)" stroke-width="2.2">
    <animate attributeName="x1" from="-120" to="980" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x2" from="-20" to="1080" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Center Ambient Glow Circle & Dot -->
  <circle cx="480" cy="10" r="6" fill="url(#center-aura)">
    <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="480" cy="10" r="2" fill="#ffffff" />
</svg>