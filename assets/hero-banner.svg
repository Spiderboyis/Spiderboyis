<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Laser Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162035" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <!-- Clip-paths for sequential typing animation -->
    <clipPath id="type-clip-1">
      <rect x="34" y="110" width="0" height="32">
        <animate attributeName="width" from="0" to="890" dur="2.4s" begin="0.3s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>

    <clipPath id="type-clip-2">
      <rect x="34" y="150" width="0" height="32">
        <animate attributeName="width" from="0" to="890" dur="2.4s" begin="2.7s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>

    <clipPath id="type-clip-3">
      <rect x="34" y="190" width="0" height="32">
        <animate attributeName="width" from="0" to="890" dur="2.4s" begin="5.1s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="958" height="288" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Background Cyber Grid -->
  <rect x="2" y="38" width="956" height="248" fill="url(#cyber-grid)" rx="0" opacity="0.7" />

  <!-- Terminal Header Bar -->
  <path d="M1 14 C1 6.82 6.82 1 14 1 L946 1 C953.18 1 959 6.82 959 14 L959 38 L1 38 Z" fill="#141a29" />
  <line x1="1" y1="38" x2="959" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="26" cy="19" r="6" fill="#ff5f56" />
  <circle cx="46" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="19" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text x="480" y="24" text-anchor="middle" fill="#8b949e" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="500">harshit@spiderboyis: ~ (zsh)</text>

  <!-- Live Status Beacon -->
  <g transform="translate(840, 12)">
    <circle cx="8" cy="7" r="4.5" fill="#73daca">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="8" cy="7" r="7.5" fill="none" stroke="#73daca" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="4.5;10;4.5" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="11" fill="#73daca" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" letter-spacing="1">ONLINE</text>
  </g>

  <!-- Top Identity Header -->
  <text x="34" y="74" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="1.2">HARSHIT MATHUR</text>
  <text x="260" y="73" fill="#7982a9" font-family="'Fira Code', monospace" font-size="13">// Full-Stack Developer &amp; Co-Founder</text>

  <!-- Top Divider Line -->
  <line x1="34" y1="92" x2="926" y2="92" stroke="#1f293d" stroke-width="1" />

  <!-- Line 1: Mission / Tagzzs & DecayState -->
  <g clip-path="url(#type-clip-1)">
    <text x="34" y="132" fill="#7aa2f7" font-family="'Fira Code', monospace" font-size="14" font-weight="600">&gt; spiderboyis.focus()</text>
    <text x="225" y="132" fill="#c0caf5" font-family="'Fira Code', monospace" font-size="14">Building Tagzzs (AI Second Brain) &amp; DecayState</text>
  </g>

  <!-- Line 2: Identity / SRM IST -->
  <g clip-path="url(#type-clip-2)">
    <text x="34" y="172" fill="#bb9af7" font-family="'Fira Code', monospace" font-size="14" font-weight="600">&gt; spiderboyis.identity()</text>
    <text x="248" y="172" fill="#a9b1d6" font-family="'Fira Code', monospace" font-size="14">B.Tech ECE (Data Sciences) @ SRM IST, Chennai</text>
  </g>

  <!-- Line 3: Tech Stack & AI / CV -->
  <g clip-path="url(#type-clip-3)">
    <text x="34" y="212" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="14" font-weight="600">&gt; spiderboyis.stack()</text>
    <text x="215" y="212" fill="#9ece6a" font-family="'Fira Code', monospace" font-size="14">Next.js · FastAPI · PyTorch · YOLOv11 · OpenCV · Supabase</text>
  </g>

  <!-- Line 4: Active Command Prompt with Blinking Cursor -->
  <g transform="translate(34, 252)">
    <text x="0" y="0" fill="#e0af68" font-family="'Fira Code', monospace" font-size="14" font-weight="600">&gt; ready_for_collaboration = true</text>
    <rect x="272" y="-13" width="8" height="16" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
