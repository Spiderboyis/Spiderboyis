  </g>

  <!-- ================= 04: SOLARFLARE & CME (BOTTOM-RIGHT) ================= -->
  <g transform="translate(504, 264)">
    <!-- Animated Radar Pulse Beacon -->
    <circle cx="-10" cy="-3" r="3" fill="#f2cc60" filter="url(#radar-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
