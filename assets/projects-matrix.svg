      <text x="114" y="14" text-anchor="middle" font-size="10" fill="#8b949e">opencv</text>

      <rect x="152" y="0" width="52" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="178" y="14" text-anchor="middle" font-size="10" fill="#8b949e">flask</text>

      <rect x="212" y="0" width="60" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="242" y="14" text-anchor="middle" font-size="10" fill="#8b949e">python</text>

