      <rect x="146" y="0" width="86" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="189" y="14" text-anchor="middle" font-size="10" fill="#8b949e">torchvision</text>

      <rect x="240" y="0" width="60" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
