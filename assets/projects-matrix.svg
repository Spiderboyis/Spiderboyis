<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
  <rect width="960" height="480" fill="#090d16"/>

  <!-- Outer Architectural Grid Frame -->
  <rect x="32" y="20" width="896" height="440" fill="none" stroke="#30363d" stroke-width="0.8"/>
  
  <!-- Grid Dividers: Center Vertical & Center Horizontal -->
  <line x1="480" y1="20" x2="480" y2="460" stroke="#30363d" stroke-width="0.8"/>
  <line x1="32" y1="240" x2="928" y2="240" stroke="#30363d" stroke-width="0.8"/>

  <!-- ================= 01: TAGZZS (TOP-LEFT) ================= -->
  <g transform="translate(56, 44)">
