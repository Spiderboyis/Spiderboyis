<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
  <defs>
    <!-- Radar Glow Filter -->
    <filter id="radar-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="480" fill="#090d16"/>

  <!-- Outer Architectural Grid Frame -->
  <rect x="32" y="20" width="896" height="440" fill="none" stroke="#30363d" stroke-width="0.8"/>
  
  <!-- Grid Dividers: Center Vertical & Center Horizontal -->
  <line x1="480" y1="20" x2="480" y2="460" stroke="#30363d" stroke-width="0.8"/>
  <line x1="32" y1="240" x2="928" y2="240" stroke="#30363d" stroke-width="0.8"/>

  <!-- ================= 01: TAGZZS (TOP-LEFT) ================= -->
  <g transform="translate(56, 44)">
    <!-- Animated Radar Pulse Beacon -->
    <circle cx="-10" cy="-3" r="3" fill="#58a6ff" filter="url(#radar-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" cy="-3" r="3" fill="none" stroke="#58a6ff" stroke-width="0.8">
      <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="0" y="0" font-size="11" fill="#58a6ff" letter-spacing="1">01 / FOUNDING VENTURE</text>
    <text x="0" y="26" font-size="18" font-weight="700" fill="#f0f6fc" letter-spacing="0.2">Tagzzs — AI Memory Layer</text>
    
    <text x="0" y="58" font-size="12" fill="#8b949e">Model-agnostic personal memory layer.</text>
    <text x="0" y="78" font-size="12" fill="#8b949e">1-click capture; Kai AI indexing graph</text>
    <text x="0" y="98" font-size="12" fill="#8b949e">autofills into ChatGPT, Claude &amp; Gemini.</text>

    <!-- Micro Tags -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="76" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="38" y="14" text-anchor="middle" font-size="10" fill="#8b949e">next.js 16</text>

      <rect x="84" y="0" width="62" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="115" y="14" text-anchor="middle" font-size="10" fill="#8b949e">fastapi</text>

      <rect x="154" y="0" width="72" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="190" y="14" text-anchor="middle" font-size="10" fill="#8b949e">supabase</text>

      <rect x="234" y="0" width="62" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="265" y="14" text-anchor="middle" font-size="10" fill="#8b949e">kai-ai</text>

      <rect x="304" y="0" width="56" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="332" y="14" text-anchor="middle" font-size="10" fill="#8b949e">ext-v3</text>
    </g>

    <!-- Status & Link Note -->
    <text x="0" y="172" font-size="11" fill="#7d8590">live in prod • tagzzs.com • in-workflow /tagzzs</text>
  </g>

