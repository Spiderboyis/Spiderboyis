    <text x="0" y="0" font-size="11" fill="#f2cc60" letter-spacing="1">04 / ASTROPHYSICAL AI RESEARCH</text>
    <text x="0" y="26" font-size="18" font-weight="700" fill="#f0f6fc" letter-spacing="0.2">Solarflare &amp; CME Detector</text>
    
