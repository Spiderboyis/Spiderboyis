    </circle>
    <text x="0" y="0" font-size="11" fill="#58a6ff" letter-spacing="1">01 / FOUNDING VENTURE</text>
    <text x="0" y="26" font-size="18" font-weight="700" fill="#f0f6fc" letter-spacing="0.2">Tagzzs — AI Second Brain</text>
    
    <text x="0" y="58" font-size="12" fill="#8b949e">AI-powered second brain platform. Captures articles,</text>
    <text x="0" y="78" font-size="12" fill="#8b949e">code snippets &amp; bookmarks in 1-click; surfaces context</text>
    <text x="0" y="98" font-size="12" fill="#8b949e">directly into ChatGPT, Claude &amp; Gemini via vector search.</text>

    <!-- Micro Tags -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="76" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="38" y="14" text-anchor="middle" font-size="10" fill="#8b949e">next.js 16</text>

      <rect x="84" y="0" width="62" height="20" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
      <text x="115" y="14" text-anchor="middle" font-size="10" fill="#8b949e">fastapi</text>

